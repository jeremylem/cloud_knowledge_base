AWSTemplateFormatVersion: '2010-09-09'
Description: Notes Assistant - Infrastructure (S3, S3 Vectors, Knowledge Base, IAM)

Parameters:
  BucketName:
    Type: String
  KnowledgeBaseName:
    Type: String

Resources:
  # S3 Bucket for Notes (source documents)
  NotesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: notes-assistant

  # S3 Vectors Bucket for embeddings storage
  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub "${BucketName}-vectors"

  # S3 Vectors Index
  VectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      IndexName: !Sub "${KnowledgeBaseName}-index"
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT
          - AMAZON_BEDROCK_METADATA
    DependsOn: VectorBucket

  # IAM Role for Bedrock Knowledge Base
  BedrockKnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${KnowledgeBaseName}-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3NotesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt NotesBucket.Arn
                  - !Sub "${NotesBucket.Arn}/*"
        - PolicyName: S3VectorsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3vectors:GetVectorBucket
                  - s3vectors:ListIndexes
                Resource:
                  - !GetAtt VectorBucket.VectorBucketArn
              - Effect: Allow
                Action:
                  - s3vectors:GetIndex
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:ListVectors
                Resource:
                  - !GetAtt VectorIndex.IndexArn
        - PolicyName: BedrockModelAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"

  # Bedrock Knowledge Base with S3 Vectors
  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Ref KnowledgeBaseName
      Description: Knowledge base for personal notes using S3 Vectors
      RoleArn: !GetAtt BedrockKnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !GetAtt VectorIndex.IndexArn
    DependsOn:
      - VectorIndex
      - BedrockKnowledgeBaseRole

  # Data Source pointing to notes S3 bucket
  DataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: notes-s3-source
      Description: S3 data source for notes
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt NotesBucket.Arn
          InclusionPrefixes:
            - "notes/"
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 10
    DependsOn: KnowledgeBase

Outputs:
  NotesBucketName:
    Value: !Ref NotesBucket

  NotesBucketArn:
    Value: !GetAtt NotesBucket.Arn

  VectorBucketArn:
    Value: !GetAtt VectorBucket.VectorBucketArn

  VectorIndexArn:
    Value: !GetAtt VectorIndex.IndexArn

  KnowledgeBaseId:
    Value: !Ref KnowledgeBase

  KnowledgeBaseArn:
    Value: !GetAtt KnowledgeBase.KnowledgeBaseArn

  DataSourceId:
    Value: !GetAtt DataSource.DataSourceId
